[package]
name          = "tellus-bootstrap-k8s"
description   = "Kubernetes seed discovery for tellus cluster bootstrap"
version       = "0.1.0"
edition       = { workspace = true }
license       = { workspace = true }
readme        = "README.md"
homepage      = { workspace = true }
repository    = { workspace = true }
documentation = "https://docs.rs/tellus-bootstrap-k8s/latest/tellus_bootstrap_k8s/"
publish       = true

[package.metadata.docs.rs]
features = [ "k8s-openapi/latest" ]

[features]
serde = [ "dep:serde" ]

[dependencies]
derive_more = { workspace = true, features = [ "debug" ] }
k8s-openapi = { workspace = true }
kube        = { workspace = true, features = [ "client", "ring", "rustls-tls" ] }
serde       = { workspace = true, features = [ "derive" ], optional = true }
tellus      = { workspace = true, features = [ "cluster" ] }
thiserror   = { workspace = true }
tracing     = { workspace = true }

[dev-dependencies]
anyhow      = { workspace = true }
http        = { workspace = true }
k8s-openapi = { workspace = true, features = [ "latest" ] }
serde_json  = { workspace = true }
tokio       = { workspace = true, features = [ "macros", "rt-multi-thread" ] }
tower-test  = { workspace = true }
