[package]
name          = "tellus-cluster-inspect"
description   = "An axum router observing a tellus cluster node: a state snapshot and a resumable stream of every change."
version       = "0.1.0"
edition       = { workspace = true }
license       = { workspace = true }
homepage      = { workspace = true }
repository    = { workspace = true }
documentation = { workspace = true }
publish       = false
readme        = "README.md"

[dependencies]
axum         = { workspace = true, features = [ "http1", "json", "tokio" ] }
futures-util = { workspace = true }
serde        = { workspace = true, features = [ "derive" ] }
serde_json   = { workspace = true }
tellus       = { workspace = true, features = [ "cluster", "serde" ] }
thiserror    = { workspace = true }
tokio        = { workspace = true, features = [ "macros", "rt", "sync", "time" ] }

[dev-dependencies]
http-body-util = { workspace = true }
tokio          = { workspace = true, features = [ "rt-multi-thread" ] }
tower          = { workspace = true, features = [ "util" ] }
