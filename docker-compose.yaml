services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tellus
      POSTGRES_PASSWORD: tellus
      POSTGRES_USER: tellus
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 2s
      timeout: 2s
      retries: 5
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"

volumes:
  postgres-data:
