name: Profile

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: profile-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  toolchain:
    name: Setup Rust toolchain
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.set_toolchain.outputs.stable }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Output toolchain
        id: set_toolchain
        run: |
          stable=$(grep channel rust-toolchain.toml | sed -r 's/channel = "(.*)"/\1/')
          echo "stable=$stable" | tee -a "$GITHUB_OUTPUT"

  profile-pr:
    name: Profile against merge base
    runs-on: ubuntu-latest
    needs: toolchain
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ needs.toolchain.outputs.stable }}

      - name: Install just
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: just

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install hotpath-utils
        run: |
          cargo install hotpath --version '^0.23' --features utils --locked

      - name: Profile merge base
        id: base
        continue-on-error: true
        env:
          HOTPATH_OUTPUT_FORMAT: json
          HOTPATH_OUTPUT_PATH: /tmp/metrics/base.json
        run: |
          rustup override set ${{ needs.toolchain.outputs.stable }}
          mkdir -p /tmp/metrics
          base=$(git merge-base origin/main HEAD)
          git checkout --detach "$base"
          git checkout "$GITHUB_SHA" -- justfile
          just profile-alloc

      # The merge base may predate the persistence profiling example; the report then carries a
      # note instead of the persistence comparison for this PR. Gated on the base step's outcome:
      # if that step failed before its checkout, the repository still holds the PR head, and
      # profiling it here would report a head-vs-head persistence comparison as the base.
      - name: Profile merge base (persistence)
        id: base-persistence
        if: steps.base.outcome == 'success'
        continue-on-error: true
        env:
          HOTPATH_OUTPUT_FORMAT: json
          HOTPATH_OUTPUT_PATH: /tmp/metrics/base-persistence.json
        run: |
          just profile-persistence-alloc

      - name: Profile PR head
        env:
          HOTPATH_OUTPUT_FORMAT: json
          HOTPATH_OUTPUT_PATH: /tmp/metrics/head.json
        run: |
          git checkout -f --detach "$GITHUB_SHA"
          just profile-alloc

      - name: Profile PR head (persistence)
        env:
          HOTPATH_OUTPUT_FORMAT: json
          HOTPATH_OUTPUT_PATH: /tmp/metrics/head-persistence.json
        run: |
          just profile-persistence-alloc

      - name: Compare against merge base
        run: |
          echo "## Messaging" > report.md
          if [ "${{ steps.base.outcome }}" = "success" ]; then
            hotpath-utils profile-pr \
              --head-metrics /tmp/metrics/head.json \
              --base-metrics /tmp/metrics/base.json \
              --dry-run >> report.md
          else
            echo "_The merge base cannot be profiled, likely it lacks the hotpath feature; no comparison._" >> report.md
          fi
          echo "## Persistence" >> report.md
          if [ "${{ steps.base-persistence.outcome }}" = "success" ]; then
            hotpath-utils profile-pr \
              --head-metrics /tmp/metrics/head-persistence.json \
              --base-metrics /tmp/metrics/base-persistence.json \
              --dry-run >> report.md
          else
            echo "_The merge base cannot be profiled, likely it lacks the persistence profiling example; no comparison._" >> report.md
          fi

      - name: Report
        run: |
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: profile
          path: report.md

      - name: Enforce zero allocations on the messaging path
        run: |
          just profile-alloc-check /tmp/metrics/head.json

      - name: Enforce zero allocations on the apply and replay paths
        run: |
          just profile-persistence-alloc-check /tmp/metrics/head-persistence.json
