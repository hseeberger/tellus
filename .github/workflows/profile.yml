name: Profile

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: profile-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  toolchain:
    name: Setup Rust toolchain
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.set_toolchain.outputs.stable }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Output toolchain
        id: set_toolchain
        run: |
          stable=$(grep channel rust-toolchain.toml | sed -r 's/channel = "(.*)"/\1/')
          echo "stable=$stable" | tee -a "$GITHUB_OUTPUT"

  profile-pr:
    name: Profile against merge base
    runs-on: ubuntu-latest
    needs: toolchain
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ needs.toolchain.outputs.stable }}

      - name: Install just
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: just

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install hotpath-utils
        run: |
          cargo install hotpath --version '^0.23' --features utils --locked

      - name: Profile merge base
        id: base
        continue-on-error: true
        env:
          HOTPATH_OUTPUT_FORMAT: json
          HOTPATH_OUTPUT_PATH: /tmp/metrics/base.json
        run: |
          rustup override set ${{ needs.toolchain.outputs.stable }}
          mkdir -p /tmp/metrics
          base=$(git merge-base origin/main HEAD)
          git checkout --detach "$base"
          git checkout "$GITHUB_SHA" -- justfile
          just profile-alloc

      - name: Profile PR head
        env:
          HOTPATH_OUTPUT_FORMAT: json
          HOTPATH_OUTPUT_PATH: /tmp/metrics/head.json
        run: |
          git checkout -f --detach "$GITHUB_SHA"
          just profile-alloc

      - name: Compare against merge base
        if: steps.base.outcome == 'success'
        run: |
          hotpath-utils profile-pr \
            --head-metrics /tmp/metrics/head.json \
            --base-metrics /tmp/metrics/base.json \
            --dry-run > report.md

      - name: Note missing merge base profile
        if: steps.base.outcome != 'success'
        run: |
          echo "_The merge base cannot be profiled, likely it lacks the hotpath feature; no comparison._" > report.md

      - name: Report
        run: |
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: profile
          path: report.md

      - name: Enforce zero allocations on the messaging path
        run: |
          just profile-alloc-check /tmp/metrics/head.json
