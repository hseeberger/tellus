[package]
name          = "tellus"
description   = "A resilient world of actors for Rust: typed messages, supervision trees, death watch, event sourcing."
version       = "0.2.1"
edition       = { workspace = true }
license       = { workspace = true }
readme        = "README.md"
homepage      = { workspace = true }
repository    = { workspace = true }
documentation = "https://docs.rs/tellus/latest/tellus/"
publish       = true

[package.metadata.docs.rs]
all-features = true

[features]
hotpath           = [ "dep:hotpath", "hotpath/hotpath" ]
hotpath-alloc     = [ "hotpath", "hotpath/hotpath-alloc" ]
persistence       = [ "dep:ciborium", "dep:serde", "dep:serde_json", "dep:trait-variant" ]
persistence-tests = [ "persistence" ]
serde             = [ "dep:humantime-serde", "dep:serde" ]

[dependencies]
ciborium        = { workspace = true, optional = true }
derive_more     = { workspace = true, features = [ "debug", "display", "into" ] }
flume           = { workspace = true, features = [ "async" ] }
hotpath         = { workspace = true, optional = true }
humantime-serde = { workspace = true, optional = true }
serde           = { workspace = true, features = [ "derive" ], optional = true }
serde_json      = { workspace = true, optional = true }
thiserror       = { workspace = true }
tokio           = { workspace = true, features = [ "macros", "rt", "sync", "time" ] }
tracing         = { workspace = true }
trait-variant   = { workspace = true, optional = true }
uuid            = { workspace = true, features = [ "v7" ] }

[dev-dependencies]
anyhow             = { workspace = true }
criterion          = { workspace = true, features = [ "async_tokio" ] }
serde              = { workspace = true, features = [ "derive" ] }
serde_json         = { workspace = true }
tracing-subscriber = { workspace = true, features = [ "env-filter", "fmt", "json" ] }
tokio              = { workspace = true, features = [ "macros", "rt-multi-thread", "test-util", "time" ] }

[[example]]
name              = "profile"
required-features = [ "hotpath" ]

[[example]]
name              = "profile_persistence"
required-features = [ "hotpath", "persistence" ]

[[bench]]
name    = "messaging"
harness = false

[[bench]]
name              = "persistence"
harness           = false
required-features = [ "persistence" ]
