[workspace]
resolver        = "3"
members         = [ "tellus", "tellus-bootstrap-dns", "tellus-bootstrap-k8s", "tellus-persistence-postgres", "tellus-cluster-demo", "tellus-comparison" ]
default-members = [ "tellus", "tellus-bootstrap-dns", "tellus-bootstrap-k8s", "tellus-persistence-postgres" ]

[workspace.package]
edition       = "2024"
license       = "Apache-2.0"
homepage      = "https://github.com/hseeberger/tellus"
repository    = "https://github.com/hseeberger/tellus"
documentation = "https://github.com/hseeberger/tellus"
publish       = false

[workspace.dependencies]
anyhow                 = { version = "1.0" }
axum                   = { version = "0.8", default-features = false }
ciborium               = { version = "0.2" }
composed               = { version = "0.1" }
configured             = { version = "0.9" }
criterion              = { version = "0.8" }
derive_more            = { version = "2.1" }
erased-serde           = { version = "0.4" }
flume                  = { version = "0.12", default-features = false }
futures-util           = { version = "0.3" }
hickory-resolver       = { version = "0.26" }
hickory-server         = { version = "0.26" }
hotpath                = { version = "0.24" }
http                   = { version = "1.5" }
humantime-serde        = { version = "1.1" }
k8s-openapi            = { version = "0.28", default-features = false }
kameo                  = { version = "0.22", default-features = false }
kube                   = { version = "4.2", default-features = false }
postcard               = { version = "1.1", default-features = false }
quinn                  = { version = "0.11", default-features = false }
ractor                 = { version = "0.16", default-features = false }
rcgen                  = { version = "0.13", default-features = false }
reqwest                = { version = "0.12", default-features = false }
rustls                 = { version = "0.23", default-features = false }
serde                  = { version = "1.0" }
serde_json             = { version = "1.0" }
sqlx                   = { version = "0.9", default-features = false }
tempfile               = { version = "3" }
testcontainers-modules = { version = "0.15" }
thiserror              = { version = "2.0" }
tokio                  = { version = "1" }
tower-test             = { version = "0.4" }
tracing                = { version = "0.1" }
tracing-subscriber     = { version = "0.3" }
trait-variant          = { version = "0.1" }
uuid                   = { version = "1.24" }
x509-parser            = { version = "0.18" }
tellus                 = { path = "tellus", version = "0.2.1" }
tellus-bootstrap-dns   = { path = "tellus-bootstrap-dns", version = "0.1.0" }
tellus-bootstrap-k8s   = { path = "tellus-bootstrap-k8s", version = "0.1.0" }
